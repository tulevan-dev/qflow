name: qflow

services:
  postgres:
    ports:
      - "127.0.0.1:15432:5432"
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Required}
      POSTGRES_DB: postgres
      HELLO_DB_PASSWORD: ${HELLO_DB_PASSWORD:?Required}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - qflow-net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qflow-net

  kafka:
    image: apache/kafka:3.9.2
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: "PLAINTEXT://:19092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null 2>&1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - qflow-net

  hello:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.java
      args:
        MODULE: hello
    environment:
      SERVER_PORT: 8081
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      SPRING_MAIN_BANNER_MODE: "off"
      SPRING_OUTPUT_ANSI_ENABLED: NEVER
      HELLO_DB_URL: jdbc:postgresql://postgres:5432/${HELLO_DB_NAME}
      HELLO_DB_USER: ${HELLO_DB_USER:-hello_app}
      HELLO_DB_PASSWORD: ${HELLO_DB_PASSWORD:?required}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - qflow-net

  gateway:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.java
      args:
        MODULE: gateway
    environment:
      SERVER_PORT: 8080
      HELLO_SERVICE_URL: http://hello:8081
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      SPRING_MAIN_BANNER_MODE: "off"
      SPRING_OUTPUT_ANSI_ENABLED: NEVER
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      hello:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - qflow-net

networks:
  qflow-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
