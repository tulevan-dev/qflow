server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: hello-route
              uri: ${HELLO_SERVICE_URL:http://localhost:8081}
              # uri: ${HELLO_SERVICE_URL:http://hello:8081}
              predicates:
                - Path=/hello
  webflux:
    problemdetails:
      # GatewayProblemHandler renders routing errors with the QFlow contract.
      enabled: false
  output:
    ansi:
      enabled: ALWAYS
