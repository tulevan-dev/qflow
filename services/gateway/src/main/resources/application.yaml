server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: hello-route
              uri: ${HELLO_URI:http://localhost:8081}
              # uri: ${HELLO_URI:http://hello:8081}
              predicates:
                - Path=/hello
  webflux:
    problemdetails:
      enabled: true

logging:
  structured:
    format:
      console: ecs