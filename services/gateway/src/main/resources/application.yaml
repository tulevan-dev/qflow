server:
#  port: 8080
  port: 9090

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: hello-route
              uri: ${HELLO_SERVICE_URL:http://localhost:9091}
              # uri: ${HELLO_SERVICE_URL:http://hello:8081}
              predicates:
                - Path=/hello
  webflux:
    problemdetails:
      # GatewayProblemHandler renders routing errors with the QFlow contract.
      enabled: false
  output:
    ansi:
      enabled: ALWAYS

springdoc:
  swagger-ui:
    url: /openapi-phase0.yaml
    disable-swagger-default-url: true
